<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Petmate · Console di test</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2345708F'/%3E%3Ccircle cx='16' cy='18' r='6' fill='%23F0A830'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/console.css">
  <!-- Vendored crypto libraries (no CDN: the LAN may have no internet). -->
  <script type="importmap">
    {
      "imports": {
        "@noble/curves/": "./vendor/noble-curves/",
        "@noble/hashes/": "./vendor/noble-hashes/",
        "@noble/ciphers/": "./vendor/noble-ciphers/"
      }
    }
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/robots">
      <span class="logo" aria-hidden="true"></span>
      <span>Petmate</span>
      <span class="badge-test">Console di test</span>
    </a>
    <nav id="nav" hidden>
      <span id="user-email" class="muted"></span>
      <span id="signal-state" class="dot" title="Signaling"></span>
      <button id="logout" class="btn ghost small" type="button">Esci</button>
    </nav>
  </header>
  <main id="view" aria-live="polite">
    <noscript>Serve JavaScript.</noscript>
  </main>
  <div id="toast" role="status" hidden></div>
</body>
</html>
