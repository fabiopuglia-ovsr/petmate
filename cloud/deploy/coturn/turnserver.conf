# coturn — Petmate TURN/STUN. Secret, realm and external IP are passed on the
# command line from docker-compose (.env): --static-auth-secret, --realm, --external-ip.
listening-port=3478
tls-listening-port=5349

# REST API auth (time-limited credentials minted by the API, /v1/ice-servers)
use-auth-secret
# static-auth-secret=<TURN_SECRET>        (set via CLI)
# realm=turn.petmate.example              (set via CLI)
# external-ip=<PUBLIC_IP>[/<PRIVATE_IP>]  (set via CLI; needed behind NAT / cloud VMs)

min-port=49160
max-port=49200

fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
stale-nonce=600
user-quota=12
total-quota=1200
# Do not relay to private/loopback ranges (SSRF protection)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

log-file=stdout
simple-log
