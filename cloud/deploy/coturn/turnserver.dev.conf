# coturn — Petmate DEV (compose profile `turn`). Plain TURN on 3478 udp/tcp, no TLS.
# Secret, realm and external IP come from docker-compose.dev.yml.
# Router port forwarding to this PC: 3478 udp+tcp, 49160-49200 udp.
listening-port=3478
min-port=49160
max-port=49200
use-auth-secret
no-tls
no-dtls
fingerprint
no-cli
no-multicast-peers
stale-nonce=600
user-quota=12
total-quota=120
# Unlike production, private ranges are NOT denied: the robot sits in the same home LAN
# as coturn and the relay must reach its 192.168.x.x host candidate. Loopback stays denied.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1
log-file=stdout
simple-log
