name: petmate
description: App Petmate — robot domestico per la cura degli animali (iOS + Android).
publish_to: "none"
version: 0.1.0+1

# Minimum toolchain: Flutter 3.35 / Dart 3.9 (required by go_router 17.2.x).
# API surface checked against Flutter 3.35 → 3.44 (see REVIEW_NOTES.md).
environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

# Direct dependencies are pinned to exact releases whose sources were reviewed
# (REVIEW_NOTES.md §1). Transitive packages resolve normally; commit the
# generated pubspec.lock after the first successful `flutter pub get`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Media / connectivity
  flutter_webrtc: 1.5.2           # 2026-06; AGP 9 aware, compileSdk 36, iOS 13
  # 1.36.8 is the last BSD-3 release. 2.x switched to the "FlutterBluePlus
  # License" (paid tier for companies ≥ 15 employees + build-time ping):
  # do NOT upgrade without a licensing decision.
  flutter_blue_plus: 1.36.8
  web_socket_channel: 3.0.3
  http: 1.5.0
  # Crypto (X25519, HKDF-SHA256, ChaCha20-Poly1305) — pure Dart
  cryptography: 2.9.0
  # State + navigation (provider is used everywhere; no riverpod)
  provider: 6.1.5+1
  go_router: 17.2.3
  # Storage / platform
  flutter_secure_storage: 10.3.1
  permission_handler: 12.0.1
  # Push notifications — only initialized with --dart-define=PETMATE_FCM=true.
  # Last 3.x/15.x line (Firebase iOS SDK 11, iOS 13 minimum).
  firebase_core: 3.15.2
  firebase_messaging: 15.2.10
  # UI helpers. intl MUST stay `any`: flutter_localizations pins the exact
  # intl version per Flutter release (0.20.2 on 3.35–3.44); a fixed
  # constraint here breaks `pub get` on the next Flutter upgrade.
  intl: any
  video_player: 2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
