# MVP drop-in for petmate-core.service (installed by robot/scripts/install_mvp.sh as
# /etc/systemd/system/petmate-core.service.d/mvp.conf).
#
# Prototype choice: run pm-core as root. It needs
#  * NetworkManager write access (nmcli connection add/up/delete) during BLE provisioning,
#  * BlueZ D-Bus GattManager1/LEAdvertisingManager1 registration (bless),
#  * /dev/video* (USB webcam) and /etc/petmate/identity.json (0600 root).
# The product unit (User=petmate + polkit rule + bluetooth group) stays untouched in
# the base unit; delete this drop-in to go back to it.
[Unit]
Description=Petmate pm-core (MVP: USB webcam, WebRTC, BLE provisioning)
After=bluetooth.service NetworkManager.service
Wants=bluetooth.service NetworkManager.service

[Service]
User=root
Group=root
SupplementaryGroups=
# not used in the MVP (no display/audio)
UnsetEnvironment=SDL_VIDEODRIVER SDL_AUDIODRIVER SDL_NOMOUSE
# The profile comes from /etc/petmate/core.json ("profile": "mvp").
# Faster restart while iterating on hardware:
RestartSec=2
